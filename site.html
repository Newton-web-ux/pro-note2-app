<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading…</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📋%3C/text%3E%3C/svg%3E">
<style>
  html, body { height: 100%; margin: 0; background: #f3f5f9; font-family: system-ui, 'Segoe UI', sans-serif; }
  #msg { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #667085; text-align: center; padding: 24px; }
  #msg b { font-size: 20px; color: #16305a; }
  .spin { width: 28px; height: 28px; border: 3px solid #d6deef; border-top-color: #2b579a; border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #f { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #fff; }
</style>
</head>
<body>
<div id="msg"><div class="spin" id="sp"></div><b>Pro Document</b><span id="t">Loading website…</span></div>
<iframe id="f" title="Website" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe>
<script>
/* OWNER: paste the same Apps Script web-app URL (ending in /exec) you used in word-pro-addon-3-v2.js. */
const SITE_API_URL = 'https://script.google.com/macros/s/AKfycbxQhtNiPY7evhP83lZDaDaFOetrh_EpUfcgvwRIhNamNeBJbva-2YHXrFuFaMEdrzJX/exec';

const slug = (() => {
  const m = location.pathname.match(/\/s\/([a-z0-9-]{3,50})\/?$/i);      // pretty form: /s/my-site
  return ((m && m[1]) || new URLSearchParams(location.search).get('s') || '').toLowerCase();   // or /site.html?s=my-site
})();
const fail = t => { document.getElementById('sp').style.display = 'none'; document.getElementById('t').textContent = t; document.title = 'Pro Document'; };

(async () => {
  if (!slug) return fail('No website address was given.');
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(SITE_API_URL)) return fail('This site viewer is not set up yet.');
  try {
    const r = await fetch(SITE_API_URL + '?site=' + encodeURIComponent(slug) + '&raw=1');
    const j = await r.json();
    if (!j.ok) return fail('This website was not found or is not published.');
    document.title = j.name || 'Website';
    const f = document.getElementById('f');
    f.srcdoc = j.html;                       // runs in a sandbox with no access to this site, its login or its storage
    f.onload = () => { document.getElementById('msg').style.display = 'none'; f.style.display = 'block'; };
  } catch (e) { fail('Could not load this website. Please try again.'); }
})();
</script>
<script>
(function removeHTML(){

  const path = window.location.pathname;

  if (path.endsWith(".html")) {

    const cleanPath = path.substring(0, path.length - 5);

    window.history.replaceState(
      null,
      document.title,
      cleanPath
    );

  }

})();
</script>
</body>
</html>
